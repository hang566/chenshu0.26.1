<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | 云枢</title>
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/variables.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/base.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/layout.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/forms.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/feedback.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/display.css">
    <style>
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: inherit; }
        .login-card { width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); padding: 32px 28px; box-sizing: border-box; }
        .brand { text-align: center; margin-bottom: 22px; }
        .brand .logo { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 16px; background: var(--main); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; }
        .brand h1 { margin: 0; font-size: 1.4rem; }
        .brand .sub { font-size: 0.82rem; color: color-mix(in srgb, var(--text) 55%, transparent); margin-top: 4px; }
        .mode-badge { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 16px; }
        .mode-badge.online { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 30%, transparent); }
        .mode-badge.offline { background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--warning); border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent); }
        .mode-badge.checking { background: color-mix(in srgb, var(--text) 8%, transparent); color: color-mix(in srgb, var(--text) 60%, transparent); }
        .data-notice { background: color-mix(in srgb, var(--warning) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent); color: var(--warning); padding: 10px 12px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 16px; display: none; line-height: 1.6; }
        .form-item { margin-bottom: 14px; }
        .form-item label { display: block; font-size: 0.84rem; color: color-mix(in srgb, var(--text) 65%, transparent); margin-bottom: 6px; }
        .form-item input { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.92rem; background: var(--bg); color: var(--text); font-family: inherit; box-sizing: border-box; transition: border-color 0.2s; }
        .form-item input:focus { outline: none; border-color: var(--main); }
        .btn-primary { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--main); color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: color-mix(in srgb, var(--main) 85%, #000); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .form-error { color: var(--danger); font-size: 0.8rem; min-height: 1.2em; margin: 4px 0 10px; }
        .footer-link { text-align: center; margin-top: 18px; font-size: 0.86rem; }
        .footer-link a { color: var(--main); text-decoration: none; }
        .footer-link a:hover { text-decoration: underline; }
        .tip { font-size: 0.74rem; color: color-mix(in srgb, var(--text) 50%, transparent); text-align: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand">
            <div class="logo">云</div>
            <h1>欢迎回来</h1>
            <div class="sub">登录以同步您的数据</div>
        </div>
        <div class="mode-badge checking" id="modeBadge">⏳ 正在检测服务器…</div>
        <div class="data-notice" id="dataNotice"></div>
        <form id="loginForm" novalidate>
            <div class="form-item">
                <label for="loginId">用户名或专属编码</label>
                <input type="text" id="loginId" autocomplete="username" placeholder="请输入用户名或编码" required>
            </div>
            <div class="form-item">
                <label for="password">密码</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码" required>
            </div>
            <div class="form-error" id="formError"></div>
            <button type="submit" class="btn-primary" id="submitBtn">登录</button>
        </form>
        <div class="footer-link">没有账号？<a href="../register/register.html">去注册</a></div>
        <div class="tip" id="modeTip">正在检测服务器状态…</div>
    </div>

    <script src="../../UI/primoUI 0.2/js/modules/theme.js"></script>
    <script src="../js/api.js"></script>
    <script>
        // 全局状态
        let isOnlineMode = false;
        let offlineUserData = null;
        const ONLINE_CACHE_KEY = 'yunshu_online_cache';
        const ONLINE_CACHE_TTL = 60000; // 1 分钟缓存，避免每次进入都阻塞等待

        function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
        function showError(msg) { document.getElementById('formError').textContent = msg; }

        // 非阻塞模式检测：表单立即可用，结果异步更新徽章
        async function detectMode() {
            // 先用会话缓存快速展示，避免空白等待
            let cached = null;
            try { cached = JSON.parse(sessionStorage.getItem(ONLINE_CACHE_KEY) || 'null'); } catch (e) { }
            if (cached && (Date.now() - cached.t < ONLINE_CACHE_TTL)) {
                applyMode(cached.online);
            }
            try {
                isOnlineMode = await ApiService.isServerAvailable();
                sessionStorage.setItem(ONLINE_CACHE_KEY, JSON.stringify({ online: isOnlineMode, t: Date.now() }));
                applyMode(isOnlineMode);
                checkExistingSession();
            } catch (e) {
                isOnlineMode = false;
                applyMode(false);
                checkExistingSession();
            }
        }
        function applyMode(online) {
            const badge = document.getElementById('modeBadge');
            const tip = document.getElementById('modeTip');
            if (online) {
                badge.className = 'mode-badge online';
                badge.textContent = '🟢 联机模式 · 服务器已连接';
                tip.textContent = '联机模式，数据将与服务端同步。';
            } else {
                badge.className = 'mode-badge offline';
                badge.textContent = '🟡 脱机模式 · 仅本地账号';
                tip.textContent = '脱机模式，仅支持本地账号登录。';
            }
        }
        function checkExistingSession() {
            const userData = localStorage.getItem('user');
            if (!userData) return;
            let user;
            try { user = JSON.parse(userData); } catch (e) { return; }
            if (user.type === 'offline') {
                offlineUserData = user;
                const notice = document.getElementById('dataNotice');
                notice.style.display = 'block';
                notice.innerHTML = '<strong>📱 检测到本地脱机账号</strong> · ' + escapeHtml(user.username) + '<br>登录成功后将升级为联机账号并继承当前数据。';
            } else if (user.type === 'online') {
                // 已登录联机账号，静默跳转，不弹窗打断
                window.location.replace('../user/user.html');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const loginId = document.getElementById('loginId').value.trim();
            const password = document.getElementById('password').value;
            if (!loginId || !password) { showError('请填写完整信息'); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = '登录中…'; showError('');
            try {
                if (isOnlineMode) {
                    await loginOnline(loginId, password);
                } else {
                    loginOffline(loginId, password);
                }
                // 成功：保持禁用，等待跳转
            } catch (err) {
                showError('登录失败：' + (err && err.message ? err.message : '未知错误'));
                btn.disabled = false; btn.textContent = '登录';
            }
        });

        async function loginOnline(loginId, password) {
            const result = await ApiService.login(loginId, password);
            if (result.data && result.data.token) ApiService.setToken(result.data.token);
            const userData = { ...result.data.user, type: 'online' };
            // 继承脱机账号数据
            if (offlineUserData && offlineUserData.username === loginId) {
                userData.code = offlineUserData.code;
                userData.createdAt = offlineUserData.createdAt;
                userData._offlineData = offlineUserData.data || {};
            }
            localStorage.setItem('user', JSON.stringify(userData));
            toastSuccess('登录成功，欢迎回来 ' + userData.username);
            setTimeout(() => window.location.href = '../user/user.html', 450);
        }
        function loginOffline(loginId, password) {
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const matched = accounts.find(a => (a.username === loginId || a.code === loginId) && a._password === password);
            if (!matched) throw new Error('用户名/编码或密码错误');
            let data = { ...matched }; delete data._password;
            // 继承脱机账号数据
            if (offlineUserData && offlineUserData.username === loginId) {
                data.code = offlineUserData.code;
                data.createdAt = offlineUserData.createdAt;
                if (offlineUserData.data) data.data = { ...(data.data || {}), ...offlineUserData.data };
            }
            data.type = 'online';
            localStorage.setItem('user', JSON.stringify(data));
            toastSuccess('登录成功，欢迎回来 ' + data.username);
            setTimeout(() => window.location.href = '../user/user.html', 450);
        }

        let toastTimer = null;
        function toastSuccess(msg) {
            let el = document.getElementById('loginToast');
            if (!el) {
                el = document.createElement('div'); el.id = 'loginToast';
                el.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:24px;font-size:0.9rem;z-index:9999;color:#fff;background:var(--success);box-shadow:0 4px 16px rgba(0,0,0,0.2);transition:opacity .3s;';
                document.body.appendChild(el);
            }
            el.textContent = msg; el.style.opacity = '1';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1600);
        }

        // 启动：立即渲染表单 + 异步检测
        detectMode();
    </script>
    <script src="../js/cloud-sync.js"></script>
</body>

</html>
