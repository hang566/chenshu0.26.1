<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 | 云枢</title>
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/variables.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/base.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/layout.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/forms.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/feedback.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/navigation.css">
    <link rel="stylesheet" href="../../UI/primoUI 0.2/css/modules/display.css">
    <style>
        body { background: var(--bg); color: var(--text); }
        .container { max-width: 560px; margin: 0 auto; padding: 20px; margin-top: 50px; }
        .section-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; }
        hr { border: none; border-top: 1px solid var(--border); margin: 0 0 20px; }

        .user-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 24px; text-align: center; }
        .avatar-lg { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; background: var(--main); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700; }
        .u-name { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tag { font-size: 0.72rem; padding: 2px 9px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
        .tag.online { background: color-mix(in srgb, var(--success) 16%, transparent); color: var(--success); }
        .tag.offline { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--warning); }
        .info-grid { margin-top: 18px; display: grid; grid-template-columns: 1fr; gap: 8px; text-align: left; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--bg); border-radius: 8px; font-size: 0.88rem; gap: 10px; }
        .info-row .k { color: color-mix(in srgb, var(--text) 60%, transparent); flex-shrink: 0; }
        .info-row .v { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; word-break: break-all; text-align: right; }
        .copy-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 0.72rem; cursor: pointer; color: var(--main); flex-shrink: 0; }
        .copy-btn:hover { background: color-mix(in srgb, var(--main) 10%, transparent); }
        .actions { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--btn-bg); color: var(--text); font-size: 0.9rem; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn:hover { background: var(--btn-hover); }
        .btn-primary { background: var(--main); color: #fff; border-color: var(--main); }
        .btn-primary:hover { background: color-mix(in srgb, var(--main) 85%, #000); }
        .btn-danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
        .btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
        .empty { text-align: center; padding: 20px 0; color: color-mix(in srgb, var(--text) 50%, transparent); }
        .empty .icon { font-size: 2.2rem; margin-bottom: 8px; }
    </style>
</head>

<body>
    <div id="nav"></div>

    <div class="container">
        <h1 class="section-title">用户中心</h1>
        <hr>
        <div class="user-card" id="userCard">
            <p class="empty">加载中…</p>
        </div>
    </div>

    <script src="../../js/nav.js"></script>
    <script src="../../UI/primoUI 0.2/js/modules/theme.js"></script>
    <script src="../js/api.js"></script>
    <script>
        let isOnlineMode = false;
        const ONLINE_CACHE_KEY = 'yunshu_online_cache';

        function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

        // 非阻塞模式检测：先用会话缓存渲染，再异步校正
        async function detectMode() {
            let cached = null;
            try { cached = JSON.parse(sessionStorage.getItem(ONLINE_CACHE_KEY) || 'null'); } catch (e) { }
            if (cached && (Date.now() - cached.t < 60000)) {
                isOnlineMode = cached.online;
                render();
            }
            try {
                isOnlineMode = await ApiService.isServerAvailable();
                sessionStorage.setItem(ONLINE_CACHE_KEY, JSON.stringify({ online: isOnlineMode, t: Date.now() }));
            } catch (e) { isOnlineMode = false; }
            render();
        }

        function render() {
            const card = document.getElementById('userCard');
            const userData = localStorage.getItem('user');
            if (!userData) {
                card.innerHTML = '<div class="empty"><div class="icon">👤</div>暂无用户信息</div>' +
                    '<div class="actions">' +
                    '<button class="btn btn-primary" onclick="goToLogin()">登录</button>' +
                    '<button class="btn" onclick="goToRegister()">注册新账号</button>' +
                    '</div>';
                return;
            }
            let user;
            try { user = JSON.parse(userData); } catch (e) {
                card.innerHTML = '<div class="empty">用户数据损坏</div><div class="actions"><button class="btn btn-danger" onclick="clearUserData()">清除用户数据</button></div>';
                return;
            }
            const isOnline = user.type === 'online' && isOnlineMode;
            const initial = (user.username || '?').charAt(0).toUpperCase();
            const code = user.code || '未生成';
            card.innerHTML =
                '<div class="avatar-lg">' + escapeHtml(initial) + '</div>' +
                '<div class="u-name">' + escapeHtml(user.username) + ' <span class="tag ' + (isOnline ? 'online' : 'offline') + '">' + (isOnline ? '联机' : '脱机') + '</span></div>' +
                '<div class="info-grid">' +
                '<div class="info-row"><span class="k">邮箱/电话</span><span class="v">' + escapeHtml(user.emailOrPhone || '未绑定') + '</span></div>' +
                '<div class="info-row"><span class="k">专属编码</span><span class="v"><span style="color:var(--main);">' + escapeHtml(code) + '</span>' + (code !== '未生成' ? ' <button class="copy-btn" onclick="copyCode(this,\'' + escapeHtml(code).replace(/'/g, "\\'") + '\')">复制</button>' : '') + '</span></div>' +
                '<div class="info-row"><span class="k">注册时间</span><span class="v" style="font-weight:400;font-size:0.82rem;">' + escapeHtml(user.createdAt || '未知') + '</span></div>' +
                '</div>' +
                '<div class="actions">' +
                (isOnline
                    ? '<button class="btn btn-primary" onclick="logoutUser()">退出登录</button><button class="btn btn-danger" onclick="clearUserData()">清除用户数据</button>'
                    : '<button class="btn btn-primary" onclick="goToLogin()">登录已有账号</button><button class="btn" onclick="goToRegister()">升级为联机账号</button><button class="btn btn-danger" onclick="clearUserData()">清除用户数据</button>') +
                '</div>';
        }

        function copyCode(btn, code) {
            const done = () => { toast('已复制编码'); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
            } else { fallbackCopy(code, done); }
        }
        function fallbackCopy(text, cb) {
            const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); cb(); } catch (e) { }
            document.body.removeChild(ta);
        }

        function goToRegister() { window.location.href = '../register/register.html'; }
        function goToLogin() { window.location.href = '../login/login.html'; }

        function clearUserData() {
            if (!confirm('确定要清除所有用户数据吗？')) return;
            localStorage.removeItem('user');
            ApiService.clearToken();
            render(); toast('已清除用户数据');
        }
        async function logoutUser() {
            if (!confirm('确定要退出登录吗？退出后将进入脱机模式，本地数据将保留。')) return;
            try { await ApiService.logout(); } catch (e) { }
            ApiService.clearToken();
            const userData = localStorage.getItem('user');
            if (userData) {
                const user = JSON.parse(userData);
                user.type = 'offline';
                delete user.password;
                localStorage.setItem('user', JSON.stringify(user));
            }
            render(); toast('已退出登录，当前为脱机模式');
        }

        let toastTimer = null;
        function toast(msg) {
            let el = document.getElementById('userToast');
            if (!el) {
                el = document.createElement('div'); el.id = 'userToast';
                el.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:24px;font-size:0.9rem;z-index:9999;color:#fff;background:var(--success);box-shadow:0 4px 16px rgba(0,0,0,0.2);transition:opacity .3s;';
                document.body.appendChild(el);
            }
            el.textContent = msg; el.style.opacity = '1';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
        }

        detectMode();
        // 跨标签同步：其他页面登录/登出后即时刷新
        window.addEventListener('storage', function (e) {
            if (e.key === 'user' || e.key === ONLINE_CACHE_KEY) {
                detectMode();
            }
        });
    </script>
    <script src="../js/cloud-sync.js"></script>
</body>

</html>
